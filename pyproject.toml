[project]
name = "book2text"
dynamic = ["version"]
description = "将没有文本层的扫描版 PDF 图书转换为可追溯、经人工审校的结构化文本的本地网页应用"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pypdfium2>=4.30",
    "platformdirs>=4.2",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# OCR 运行时（说明书 Phase 0 第 1–2 项的引擎评估就在这组依赖上做，见 docs/ocr-evaluation.md）。
# 装完约 300 MB（模型随安装包内置，D-013），因此不放进核心依赖：
# 只想看界面 / 跑核心测试的人不该被迫安装。
# 用法：uv sync --group ocr-eval
ocr-eval = [
    "rapidocr>=3.10",
    "onnxruntime>=1.20",
    # 第二引擎（说明书 8.5）：macOS 用系统自带的 Apple Vision。
    # pyobjc 是平台专属依赖，因此带环境标记——在 Windows / Linux 上不该被要求安装。
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
book2text = "book2text.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "backend/book2text/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["backend/book2text"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ocr: 需要 OCR 引擎的测试（uv sync --group ocr-eval）",
]
