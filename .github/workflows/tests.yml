# Book2Text 的持续集成：**每次提交的守门人**，只跑 Ubuntu。
#
# 为什么只跑 Ubuntu（2026-10-27 用户拍板）：
#   私有仓库的 Actions 按倍数计费——Ubuntu 1×、Windows 2×、macOS **10×**。
#   之前 58 次双平台 × 每刀 5 分钟，macOS 那项就是 10 倍消耗，额度直接烧穿。
#   所以日常守门只用 1× 的 Ubuntu；macOS 全量与 Windows 放在 tests-full.yml，
#   由人手动触发，或发版本打 tag 时自动跑。
#
# Ubuntu 上没有 macOS 专属环境（Apple Vision）也不装 OCR 运行时（ocr-eval 组，
# 约 300 MB）：这些测试用 `@pytest.mark.macos_only` 标出来，这里用
# `-m "not macos_only"` **deselect**，不是让它们 skip。
#
# 铁律不变：**选中的集合里一个 skip 都不许有**。跳过 ≠ 通过（样本缺失、依赖没装、
# 平台不支持都会让结果"绿"，但那是假绿）。没有 --allow-skips，守卫也不放宽。

name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# 同一分支连着推两次时，取消上一次还在跑的 job，不重复烧额度。
# （已经有 #56 白跑 1 分 35 秒被取消的记录。）
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Ubuntu 守门（非 macOS 用例）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv（含缓存）
        uses: astral-sh/setup-uv@v10.3.0
        with:
          # 锁定开发机上的 uv 版本（0.12.3，生成 uv.lock 的那个），避免 CI 悄悄换版本。
          version: "0.12.3"
          # 与开发机一致（本机 3.12.13），避免换 Python 小版本带来的差异。
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # uv 的下载缓存已经在 setup-uv 里开了；再缓存 .venv 本身，省掉每次建环境的时间。
      # key 里带 uv.lock 的哈希：锁文件一变就重建，不会拿到旧环境。
      - name: 缓存虚拟环境
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-ubuntu-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-ubuntu-

      - name: 安装依赖（只装 dev，不装 OCR）
        run: uv sync --frozen --group dev

      - name: 跑测试（macOS 专属用 marker deselect，不 skip）
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q -rs -m "not macos_only" 2>&1 | tee pytest.log
          # 跳过 ≠ 通过：选中的集合里出现 skipped 就失败。
          if grep -qE '[0-9]+ skipped' pytest.log; then
            echo "::error::有测试被跳过——Ubuntu 守门只认实际跑过的用例，见上方 -rs 摘要"
            exit 1
          fi
          # 防"marker 没生效、整组测试被静默跳过"：必须真的 deselect 掉 macOS 组。
          if ! grep -qE '[0-9]+ deselected' pytest.log; then
            echo "::error::-m \"not macos_only\" 没有生效：macOS 专属测试必须被 deselect"
            exit 1
          fi

  # ---------------------------------------------------------------- node 闸
  # R1–R13 / A1–A5 全在 tests/js：pre-commit 能跳（--no-verify），这里是绕不过的落点。
  # 没有 npm 依赖、不需要构建：run.mjs 只用 node:test / node:vm。
  node:
    name: Ubuntu 守门（R1–R13 / A1–A5）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码（全历史 + tag）
        uses: actions/checkout@v7
        with:
          # R11（静态边棘轮）与 R12（特征测试契约）要 `git show <tag>:<path>` 和
          # `git rev-list base..HEAD`：浅克隆下 `ring-break-base` 不存在，闸会红，
          # 红的原因却不是代码——是检出方式。
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Node（锁开发机版本）
        uses: actions/setup-node@v4
        with:
          node-version: "26.8.2"

      - name: 跑 node 闸（R1–R13 / A1–A5）
        run: node tests/js/run.mjs

      # 登记段按设计不阻断提交（pre-commit 只判形态），但它必须有绕不过的落点：
      # 这里是唯一一处。--strict → 有未登记 / 登记不全的 test-contract 提交就 exit 1。
      - name: 契约登记段（§18.6，不阻断提交但阻断 CI）
        # --allow-transitional-base：当前 tag `ring-break-base`=afe20fe 打在 L0 上，
        # 不是回放基；不加这面 flag，这一步会在每次推送都红在与代码无关的地方，
        # 红久了就被关掉（比没有闸更坏）。放行时输出里会写明「按 …放行」。
        # 退场：真 base 打 tag 的那一笔必须同批删掉这面 flag，否则它就成了常开开关（§18.3）。
        run: node tests/js/contract-registry.mjs --strict --allow-transitional-base
